# PRODUCTION — main → https://mango-smoke-0323ed91e.3.azurestaticapps.net
# Release flow: feature/* → development (DEV) → qa (QA) → main (PROD), via PRs.
name: Deploy PROD (main)

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  deploy_production:
    if: github.event_name == 'push'
    uses: ./.github/workflows/_deploy-swa.yml
    with:
      environment: production
      app_env: prod
      token_secret: AZURE_STATIC_WEB_APPS_API_TOKEN_MANGO_SMOKE_0323ED91E
    secrets: inherit

  # PR qa → main: Azure creates a staging preview of the release candidate
  # (mango-smoke-0323ed91e-<PR#>.westus2.3.azurestaticapps.net) and comments the link.
  preview_pull_request:
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    name: PR preview
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Deploy PR preview
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_MANGO_SMOKE_0323ED91E }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "/"
          api_location: ""
          output_location: "dist"

  close_pull_request:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close PR preview
    steps:
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_MANGO_SMOKE_0323ED91E }}
          action: "close"
